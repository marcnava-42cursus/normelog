# CI/CD profile - For automated testing
# This profile is suitable for continuous integration pipelines

# Don't show all details (just summary)
NL_SHOW_ALL_DETAILS=0

# Use gitignore
NL_USE_GITIGNORE=1

# Exclude types that might be project-specific
# (Customize based on your project)
NL_EXCLUDE_TYPES=()

# Allow up to 10 errors in CI
NL_MAX_ERRORS=10

# Show critical errors only
NL_MIN_SEVERITY="CRITICAL"

# No debug in CI
NL_DEBUG=0

# JSON output for machine parsing
NL_OUTPUT=json

# Disable update checks in CI
NL_AUTO_UPDATE_CHECK=0

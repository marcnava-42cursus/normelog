# Development profile - For active development
# This profile is more lenient and focuses on critical issues

# Don't show all details by default
NL_SHOW_ALL_DETAILS=0

# Use gitignore to skip build artifacts
NL_USE_GITIGNORE=1

# Exclude minor formatting issues during development
NL_EXCLUDE_TYPES=(
	EMPTY_LINE_EOF
	TRAILING_WHITESPACE
	CONSECUTIVE_NEWLINES
	SPACE_EMPTY_LINE
)

# Allow up to 50 errors during development
NL_MAX_ERRORS=50

# Show warnings and above
NL_MIN_SEVERITY="WARNING"

# No debug
NL_DEBUG=0

# Text output
NL_OUTPUT=text

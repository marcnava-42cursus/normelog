# Strict profile - For submission and final code review
# This profile enforces all norminette rules with no exclusions

# Show all error details by default
NL_SHOW_ALL_DETAILS=1

# No gitignore - check everything
NL_USE_GITIGNORE=0

# No error type exclusions
NL_EXCLUDE_TYPES=()

# Fail on any error
NL_MAX_ERRORS=0

# Show all severities
NL_MIN_SEVERITY="INFO"

# No debug by default
NL_DEBUG=0

# Text output (colorized)
NL_OUTPUT=text

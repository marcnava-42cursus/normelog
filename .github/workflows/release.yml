name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare artifact
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist/normelog

          cp -r bin lib share plugins.d scripts dist/normelog/
          cp LICENSE Makefile README.md CHANGELOG.md dist/normelog/
          # Optional docs (may not exist in all branches)
          for f in TODO.md CLAUDE.md ERRORS.md FIXED.md PHASE4_IMPLEMENTATION.md; do
            if [ -f "$f" ]; then
              cp "$f" dist/normelog/
            fi
          done

          tar -czf "dist/normelog-${tag}.tar.gz" -C dist normelog

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/normelog-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
